name: Update Survey123 data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.4.1

    steps:

      # 1. Récupérer le dépôt GitHub
      - uses: actions/checkout@v4

      # 2. Installer les dépendances système nécessaires
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgdal-dev \
            libproj-dev \
            libgeos-dev \
            libudunits2-dev \
            git

      # 3. Installer les packages R
      - name: Install R packages
        run: |
          install.packages(
            "tidyverse",
            repos = "https://cloud.r-project.org"
          )

          install.packages(
            c("arcgislayers", "sf"),
            repos = "https://r-arcgis.r-universe.dev"
          )
        shell: Rscript {0}

      # 4. Exécuter le script R
      - name: Run update script
        env:
          ARCGIS_CLIENT: ${{ secrets.ARCGIS_CLIENT }}
          ARCGIS_SECRET: ${{ secrets.ARCGIS_SECRET }}
        run: |
          Rscript data_prep.R

      # 5. Envoyer le nouveau fichier sur GitHub
      - name: Commit updated data
        working-directory: ${{ github.workspace }}
        run: |
          # Diagnostic - à retirer une fois que ça fonctionne
          echo "Dossier courant :"
          pwd
          echo "Contenu du dossier :"
          ls -la
          echo "github.workspace :"
          echo "${{ github.workspace }}"

          # Autoriser Git à utiliser le dépôt dans le conteneur
          git config --global --add safe.directory "${{ github.workspace }}"
          git config --global --add safe.directory "*"

          # Configuration de Git (globale, pour éviter tout problème de contexte de dépôt)
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # Se placer explicitement dans le dépôt
          cd "${{ github.workspace }}"

          # Vérifier que .git existe bien ici
          git status

          # Ajouter le fichier mis à jour
          git add data/donnees_pretes.rds

          # Créer le commit seulement s'il y a des changements
          git commit -m "Mise à jour automatique" || echo "Rien à committer"

          # Envoyer le commit sur GitHub
          git push
