name: Update Survey123 data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Empêche plusieurs runs de tourner en même temps : si un nouveau run
# est déclenché pendant qu'un ancien tourne encore, l'ancien est annulé.
# Comme chaque run récupère l'état COMPLET des données (pas juste les
# nouvelles entrées), seul le dernier run compte vraiment.
concurrency:
  group: update-survey123-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.4.1

    steps:

      # 1. Installer git AVANT le checkout (l'image rocker/r-ver ne l'a pas par défaut,
      #    et sans git, actions/checkout télécharge les fichiers sans créer de dossier .git)
      - name: Install git
        run: apt-get update && apt-get install -y git

      # 2. Récupérer le dépôt GitHub
      - uses: actions/checkout@v4

      # 3. Installer les dépendances système nécessaires
      - name: Install system dependencies
        run: |
          apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgdal-dev \
            libproj-dev \
            libgeos-dev \
            libudunits2-dev

      # 4. Mettre en cache les packages R installés, pour ne pas les
      #    réinstaller à chaque run (gain de temps majeur : ~10 min -> ~30 sec
      #    une fois le cache "chaud")
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/R/site-library
          key: r-pkgs-${{ runner.os }}-${{ hashFiles('data_prep.R') }}
          restore-keys: |
            r-pkgs-${{ runner.os }}-

      # 5. Installer les packages R (ne fait vraiment le travail que si le
      #    cache ci-dessus est vide ou périmé)
      - name: Install R packages
        run: |
          options(repos = c(
            CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"
          ))
          # dplyr seul est suffisant si data_prep.R n'utilise pas tout tidyverse
          # (remplacez par "tidyverse" si vous utilisez d'autres fonctions, ex. stringr, purrr)
          for (pkg in c("dplyr")) {
            if (!requireNamespace(pkg, quietly = TRUE)) install.packages(pkg)
          }
          for (pkg in c("arcgislayers", "sf")) {
            if (!requireNamespace(pkg, quietly = TRUE)) install.packages(pkg, repos = "https://r-arcgis.r-universe.dev")
          }
        shell: Rscript {0}

      # 6. Exécuter le script R
      - name: Run update script
        env:
          ARCGIS_CLIENT: ${{ secrets.ARCGIS_CLIENT }}
          ARCGIS_SECRET: ${{ secrets.ARCGIS_SECRET }}
        run: |
          Rscript data_prep.R

      # 7. Envoyer le nouveau fichier sur GitHub
      - name: Commit updated data
        run: |
          # Autoriser Git à utiliser le dépôt dans le conteneur
          git config --global --add safe.directory "*"

          # Configuration de Git (globale)
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # Vérifier que .git existe bien ici (pwd = dossier courant réel du conteneur)
          pwd
          git status

          # Ajouter le fichier mis à jour
          git add data/donnees_pretes.rds

          # Créer le commit seulement s'il y a des changements
          git commit -m "Mise à jour automatique" || echo "Rien à committer"

          # Sécurité supplémentaire : re-synchroniser avant de pousser,
          # au cas où un autre commit serait arrivé entre-temps malgré 'concurrency'
          git pull --rebase origin main || echo "Rien à rebaser"

          # Envoyer le commit sur GitHub
          git push
