name: Update Survey123 data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.4.1

    steps:

      # 1. Installer git AVANT le checkout (l'image rocker/r-ver ne l'a pas par défaut,
      #    et sans git, actions/checkout télécharge les fichiers sans créer de dossier .git)
      - name: Install git
        run: apt-get update && apt-get install -y git

      # 2. Récupérer le dépôt GitHub
      - uses: actions/checkout@v4

      # 3. Installer les dépendances système nécessaires
      - name: Install system dependencies
        run: |
          apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgdal-dev \
            libproj-dev \
            libgeos-dev \
            libudunits2-dev

      # 4. Installer les packages R
      - name: Install R packages
        run: |
          install.packages(
            "tidyverse",
            repos = "https://cloud.r-project.org"
          )

          install.packages(
            c("arcgislayers", "sf"),
            repos = "https://r-arcgis.r-universe.dev"
          )
        shell: Rscript {0}

      # 5. Exécuter le script R
      - name: Run update script
        env:
          ARCGIS_CLIENT: ${{ secrets.ARCGIS_CLIENT }}
          ARCGIS_SECRET: ${{ secrets.ARCGIS_SECRET }}
        run: |
          Rscript data_prep.R

      # 6. Envoyer le nouveau fichier sur GitHub
      - name: Commit updated data
        run: |
          # Autoriser Git à utiliser le dépôt dans le conteneur
          # (on utilise "*" car le chemin réel dans le conteneur, ex. /__w/repo/repo,
          # diffère de ${{ github.workspace }} qui rapporte le chemin de l'hôte)
          git config --global --add safe.directory "*"

          # Configuration de Git (globale)
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # Vérifier que .git existe bien ici (pwd = dossier courant réel du conteneur)
          pwd
          git status

          # Ajouter le fichier mis à jour
          git add data/donnees_pretes.rds

          # Créer le commit seulement s'il y a des changements
          git commit -m "Mise à jour automatique" || echo "Rien à committer"

          # Envoyer le commit sur GitHub
          git push
